---
- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ nginx_docroot }}/{{ nginx_app_name }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy main index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_docroot }}/{{ nginx_app_name }}/index.html"
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Ensure app1 directory exists
  ansible.builtin.file:
    path: "{{ nginx_docroot }}/{{ nginx_app_name }}/app1"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy app1 index.html
  ansible.builtin.template:
    src: app1.html.j2
    dest: "{{ nginx_docroot }}/{{ nginx_app_name }}/app1/index.html"
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Ensure app2 directory exists
  ansible.builtin.file:
    path: "{{ nginx_docroot }}/{{ nginx_app_name }}/app2"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy app2 index.html
  ansible.builtin.template:
    src: app2.html.j2
    dest: "{{ nginx_docroot }}/{{ nginx_app_name }}/app2/index.html"
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx
